<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AmirXray Cutter</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <div class="logo">✂️</div>

            <div>
                <h1>AmirXray Cutter</h1>
                <p>برش ویدیو و آهنگ آنلاین</p>
            </div>
        </header>

        <div class="card">

            <label class="upload-box">

                <input
                    type="file"
                    id="fileInput"
                    accept="video/*,audio/*"
                >

                <div class="upload-icon">📁</div>

                <h2>فایل خود را انتخاب کنید</h2>

                <p>
                    ویدیو یا آهنگ را انتخاب کنید
                </p>

            </label>


            <div id="editor" class="hidden">

                <div class="file-name" id="fileName"></div>

                <video
                    id="video"
                    class="media hidden"
                    controls
                ></video>

                <audio
                    id="audio"
                    class="audio hidden"
                    controls
                ></audio>


                <div class="controls">

                    <div class="time-input">

                        <label>
                            زمان شروع
                        </label>

                        <input
                            type="number"
                            id="start"
                            value="0"
                            min="0"
                            step="0.1"
                        >

                    </div>


                    <div class="time-input">

                        <label>
                            زمان پایان
                        </label>

                        <input
                            type="number"
                            id="end"
                            value="0"
                            min="0"
                            step="0.1"
                        >

                    </div>

                </div>


                <div class="timeline">

                    <input
                        type="range"
                        id="startRange"
                        min="0"
                        value="0"
                        step="0.1"
                    >

                    <input
                        type="range"
                        id="endRange"
                        min="0"
                        value="0"
                        step="0.1"
                    >

                </div>


                <div class="buttons">

                    <button
                        id="cutButton"
                        class="cut"
                    >
                        ✂️ برش فایل
                    </button>


                    <button
                        id="resetButton"
                        class="reset"
                    >
                        🔄 فایل جدید
                    </button>

                </div>


                <div id="status"></div>


                <a
                    id="download"
                    class="download hidden"
                    download
                >
                    ⬇️ دانلود فایل
                </a>

            </div>

        </div>


        <footer>
            فایل شما روی سرور آپلود نمی‌شود.
        </footer>

    </div>


    <script src="script.js"></script>

</body>
</html>
